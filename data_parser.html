<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據對齊與趨勢引擎 (新舊系統相容升級版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 自動載入現有專案的 sim_data.js 作為預設上月備援 -->
    <script src="js/sim_data.js"></script>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --warning-color: #f59e0b;
            --danger-color: #f43f5e;
            --border-color: #334155;
            --success-color: #10b981;
            --trend-up: #ef4444; 
            --trend-down: #10b981; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h1 { color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        
        .control-panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-item label {
            font-weight: bold;
            font-size: 0.95em;
            color: var(--text-primary);
        }

        .control-hint {
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        input[type="file"], input[type="number"] {
            background-color: #0f172a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.82em;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            height: 40px;
        }

        button:hover { background-color: #0284c7; color: white;}

        .btn-success { background-color: var(--success-color); color: white; }
        .btn-success:hover { background-color: #059669; }
        
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: var(--panel-bg);
            font-size: 0.85em; 
            text-align: center;
        }

        th, td {
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            white-space: nowrap; 
        }

        th { background-color: #0f172a; color: var(--text-primary); font-weight: 600; }
        
        .group-total { background-color: rgba(56, 189, 248, 0.1); }
        .group-a { background-color: rgba(245, 158, 11, 0.05); }
        .group-b { background-color: rgba(245, 158, 11, 0.15); }
        .group-c { background-color: rgba(244, 63, 94, 0.15); }
        
        th.group-total { border-top: 3px solid #38bdf8; color: #38bdf8;}
        th.group-a { border-top: 3px solid #fbbf24; color: #fbbf24;}
        th.group-b { border-top: 3px solid #f59e0b; color: #f59e0b;}
        th.group-c { border-top: 3px solid #f43f5e; color: #f43f5e;}

        .trend-up { color: var(--trend-up); font-weight: bold; }
        .trend-down { color: var(--trend-down); font-weight: bold; }
        .trend-flat { color: var(--text-secondary); }
        .data-prev { color: var(--text-secondary); font-size: 0.9em; }

        /* 🌟 字典狀態追蹤面板 */
        .dict-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .dict-container h3 { color: var(--accent-color); margin-top: 0; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; }
        .dict-section { margin-bottom: 15px; }
        .dict-section h4 { margin: 5px 0; color: var(--text-primary); }
        .dict-section p { margin: 0 0 10px 0; color: var(--text-secondary); font-size: 0.95em; }
        .dict-unknown { background: rgba(244, 63, 94, 0.1); border-left: 4px solid var(--danger-color); padding: 10px; border-radius: 4px; }
        .dict-unknown h4, .dict-unknown p { color: var(--danger-color); }

        .problems-container {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed var(--border-color);
        }
        .problems-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .problem-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .problem-card h4 {
            margin: 0 0 10px 0;
            color: var(--text-primary);
            font-size: 1.1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
        .prob-row {
            margin-bottom: 8px;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .prob-label { font-weight: bold; display: block; margin-bottom: 2px; }
        .label-a { color: #fbbf24; }
        .label-b { color: #f59e0b; }
        .label-c { color: #f43f5e; }
        .prob-text { color: var(--text-secondary); }

        .output-panel { margin-top: 30px; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        textarea {
            width: 100%;
            height: 240px;
            background-color: #0f172a;
            color: var(--success-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            font-family: monospace;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>數據對齊與趨勢引擎 🚀 (新舊系統相容升級版)</h1>
    
    <div class="control-panel">
        <div class="control-item">
            <label>1. 載入【本月】報表 (.xlsx / .csv): </label>
            <input type="file" id="csvFileInput" accept=".xlsx,.xls,.csv">
            <span id="currFileStatus" class="control-hint">支援新系統 Excel (YouBike模擬體驗_YYYY-MM.xlsx) 或舊版 CSV</span>
        </div>
        <div class="control-item">
            <label>2. 載入【上月】報表 (選填，.xlsx / .csv): </label>
            <input type="file" id="prevFileInput" accept=".xlsx,.xls,.csv">
            <span id="prevFileStatus" class="control-hint">若未上傳，將自動從檔案內上月資料或現有 sim_data.js 帶入</span>
        </div>
        <div class="control-item">
            <label>3. 目標月份 (本月): </label>
            <input type="number" id="monthFilter" value="10" min="1" max="12" style="width: 80px;">
            <span class="control-hint">載入新系統 Excel 時會自動偵測月份</span>
        </div>
        <button onclick="processData()">▶ 執行趨勢與異常運算</button>
    </div>

    <div id="dictContainer" class="dict-container" style="display: none;"></div>

    <div id="tableContainer"></div>
    
    <div id="problemsContainer" class="problems-container" style="display: none;">
        <h3 style="color: var(--accent-color); margin-bottom: 5px;">🔍 本月各區主要異常敘述 (Top 3)</h3>
        <p style="color: var(--text-secondary); font-size: 0.9em; margin-top: 0;">自動依據新系統第一列分級標記或天網字典擷取異常項目並進行排序</p>
        <div id="problemsGrid" class="problems-grid"></div>
    </div>

    <div class="output-panel">
        <div class="output-header">
            <h3 style="margin: 0;">📋 最終轉換 JSON (請複製到 sim_data.js)</h3>
            <div style="display: flex; gap: 10px;">
                <button class="btn-success" onclick="copyJson()">📋 一鍵複製 JSON</button>
                <button class="btn-primary" onclick="downloadJson()">⬇️ 下載 sim_data.js</button>
            </div>
        </div>
        <textarea id="jsonOutput" readonly></textarea>
    </div>

    <script>
        // 分別儲存【本月檔案】與【上月檔案】解析後的標準化結構
        let currParsedDataset = null;
        let prevParsedDataset = null;

        // 🌟 記錄有實際發生的問題分別被判定到哪一級
        let problemDictionary = { a: new Set(), b: new Set(), c: new Set(), tire: new Set(), unknown: new Set() };

        // --- 頂部設定檔 (Config) ---

                "地區", "月份", "A級", "B級", "C級", "編號", "公號", 
                "測驗日期", "城市", "車號", "車柱柱號", "一級檢修日期", "一級檢修日",
                "一級檢修人員", "一級異常", "車輛異常", "一級維修異常", "總計",
                "前胎壓", "後胎壓", "可用電量", "胎壓異常",

                "桃園市": "桃園", "桃園縣": "桃園", "桃園": "桃園",

                "苗栗縣": "苗栗", "苗栗市": "苗栗", "苗栗": "苗栗",

        const targetRegionOrder = DATA_PARSER_CONFIG.targetRegionOrder;
        const metadataCols = DATA_PARSER_CONFIG.metadataCols;

        // 🌟 天網字典：同時收錄【舊版 CSV 欄位】與【新系統 Excel 欄位】作為雙重保障

        // 🌟 建立極速查表引擎 (Hash Map)
        const gradeLookupMap = new Map();
        GRADING_RULES.forEach(rule => {
            rule.exactTexts.forEach(text => {
                gradeLookupMap.set(text, rule.grade);
            });
        });

        // 🤖 自動分級鑑定器：優先使用新系統 Excel 第一列的 A/B/C 標記，若無則查表
        function autoGradeIssue(issueString, dynamicColGrades = null) {
            let cleanStr = issueString.trim();
            if (dynamicColGrades && dynamicColGrades[cleanStr]) {
                return dynamicColGrades[cleanStr];
            }
            if (gradeLookupMap.has(cleanStr)) {
                return gradeLookupMap.get(cleanStr);
            }
            return 'unknown'; 
        }

        // 🗺️ 將「縣市」或「地區」正規化為專案標準地區名稱
        function normalizeRegion(rawCityOrRegion) {
            if (!rawCityOrRegion) return '';
            let s = String(rawCityOrRegion).trim();
            if (DATA_PARSER_CONFIG.cityToRegionMap[s]) {
                return DATA_PARSER_CONFIG.cityToRegionMap[s];
            }
            for (const [cityKey, regVal] of Object.entries(DATA_PARSER_CONFIG.cityToRegionMap)) {
                if (s.includes(cityKey)) return regVal;
            }
            return s;
        }

        // 📅 從「月份」欄位或「測驗日期 (YYYY/MM/DD 或 YYYY-MM-DD 或 Excel 日期序列值)」提取月份數字 (1~12)
        function extractMonthStr(row) {
            if (row['月份'] !== undefined && row['月份'] !== null && String(row['月份']).trim() !== '') {
                let m = parseInt(String(row['月份']).trim(), 10);
                if (!isNaN(m)) return m.toString();
            }
            let dateVal = row['測驗日期'] || row['巡檢時間'] || '';
            if (typeof dateVal === 'number' && dateVal > 20000) {
                // Excel 序列日期轉換
                const utcDays = Math.floor(dateVal - 25569);
                const d = new Date(utcDays * 86400 * 1000);
                return (d.getUTCMonth() + 1).toString();
            }
            let dateStr = String(dateVal).trim();
            let match = dateStr.match(/^\d{4}[\/\-](\d{1,2})/);
            if (match) {
                return parseInt(match[1], 10).toString();
            }
            return '';
        }

        function isCheckedValue(val) {
            if (val === undefined || val === null) return false;
            const s = String(val).trim().toUpperCase();
            return s.includes('V') || s.includes('O') || s === '1' || s === 'TRUE' || s.includes('✓') || s.includes('✔');
        }

        // 📦 將二維陣列 (來自 CSV 或 XLSX Bike 工作表) 解析為標準化結構
        function parseRowsToDataset(allRows, sourceName) {
            let headerIndex = -1;
            let headers = [];
            let isNewSystemFormat = false;

            for (let i = 0; i < Math.min(allRows.length, 15); i++) {
                const rowStrs = (allRows[i] || []).map(c => c !== undefined && c !== null ? String(c).trim() : '');
                if (rowStrs.includes('地區') && rowStrs.includes('月份')) {
                    headerIndex = i;
                    headers = rowStrs;
                    isNewSystemFormat = false;
                    break;
                }
                if (rowStrs.includes('測驗日期') && rowStrs.includes('縣市') && rowStrs.includes('車號')) {
                    headerIndex = i;
                    headers = rowStrs;
                    isNewSystemFormat = true;
                    break;
                }
            }

            if (headerIndex === -1) {
                throw new Error(`在「${sourceName}」中找不到標題列（需包含「地區+月份」或新系統「測驗日期+縣市+車號」），請確認檔案格式！`);
            }

            // 若為新系統格式，檢查標題列上一列 (headerIndex - 1) 是否有 A / B / C 等級標記
            const colGrades = {};
            if (headerIndex > 0) {
                const gradeRow = allRows[headerIndex - 1] || [];
                headers.forEach((h, idx) => {
                    if (!h) return;
                    const g = gradeRow[idx] !== undefined && gradeRow[idx] !== null ? String(gradeRow[idx]).trim().toLowerCase() : '';
                    if (g === 'a' || g === 'b' || g === 'c') {
                        colGrades[h] = g;
                    }
                });
            }

            // 篩選出異常問題欄位
            const probCols = headers.filter(h => {
                if (!h || metadataCols.includes(h)) return false;
                if (Object.keys(colGrades).length > 0) {
                    return colGrades[h] !== undefined;
                }
                return true;
            });

            const rows = [];
            const detectedMonths = new Set();

            for (let i = headerIndex + 1; i < allRows.length; i++) {
                const rawRow = allRows[i];
                if (!rawRow || rawRow.length === 0) continue;

                let rowObj = {};
                for (let j = 0; j < headers.length; j++) {
                    const key = headers[j] || `未命名欄位_${j}`;
                    rowObj[key] = rawRow[j];
                }

                const reg = normalizeRegion(rowObj['地區'] || rowObj['縣市']);
                const mStr = extractMonthStr(rowObj);
                if (!reg || !mStr) continue;

                rowObj._region = reg;
                rowObj._month = mStr;
                detectedMonths.add(parseInt(mStr, 10));
                rows.push(rowObj);
            }

            return {
                sourceName,
                isNewSystemFormat,
                problemColumns: probCols,
                colGrades,
                rows,
                detectedMonths: Array.from(detectedMonths).sort((a, b) => a - b)
            };
        }

        // 📂 通用檔案讀取器：自動判別 .xlsx / .xls 與 .csv
        function loadReportFile(file, callback) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'xlsx' || ext === 'xls') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        // 優先尋找名稱為 Bike 的工作表，否則取包含「測驗日期」或第一個工作表
                        let targetSheetName = workbook.SheetNames.find(n => n.toLowerCase() === 'bike') || workbook.SheetNames[0];
                        for (const sName of workbook.SheetNames) {
                            const preview = XLSX.utils.sheet_to_json(workbook.Sheets[sName], { header: 1, range: 0, defval: '' }).slice(0, 5);
                            const flat = preview.flat().map(x => String(x).trim());
                            if ((flat.includes('測驗日期') && flat.includes('縣市')) || (flat.includes('地區') && flat.includes('月份'))) {
                                targetSheetName = sName;
                                break;
                            }
                        }
                        const worksheet = workbook.Sheets[targetSheetName];
                        const allRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '', raw: false });
                        const dataset = parseRowsToDataset(allRows, `${file.name} [${targetSheetName}]`);
                        callback(null, dataset);
                    } catch (err) {
                        callback(err, null);
                    }
                };
                reader.onerror = function(err) {
                    callback(new Error('Excel 檔案讀取失敗'), null);
                };
                reader.readAsArrayBuffer(file);
            } else {
                Papa.parse(file, {
                    header: false,
                    skipEmptyLines: true,
                    error: function(err) {
                        callback(err, null);
                    },
                    complete: function(results) {
                        try {
                            const dataset = parseRowsToDataset(results.data, file.name);
                            callback(null, dataset);
                        } catch (err) {
                            callback(err, null);
                        }
                    }
                });
            }
        }

        // 1️⃣ 監聽【本月】檔案上傳
        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loadReportFile(file, function(err, dataset) {
                if (err) {
                    alert('❌ 讀取失敗：' + err.message);
                    console.error(err);
                    return;
                }
                currParsedDataset = dataset;
                const sysTag = dataset.isNewSystemFormat ? '新系統 Excel 格式' : '舊系統 CSV 格式';
                const monthsText = dataset.detectedMonths.map(m => m + '月').join(', ');

                // 若檔案中只有單一月份（如新系統 10 月），自動將目標月份設為該月份
                if (dataset.detectedMonths.length === 1) {
                    document.getElementById('monthFilter').value = dataset.detectedMonths[0];
                } else if (dataset.detectedMonths.length > 1) {
                    document.getElementById('monthFilter').value = dataset.detectedMonths[dataset.detectedMonths.length - 1];
                }

                const statusEl = document.getElementById('currFileStatus');
                statusEl.innerHTML = `<span class="status-badge">✅ ${sysTag}｜共 ${dataset.rows.length} 筆車次｜${dataset.problemColumns.length} 項異常欄位｜包含月份：${monthsText}</span>`;

                alert(`✅ 本月報表解析成功！\n• 系統格式：${sysTag}\n• 掃描車次：${dataset.rows.length} 輛\n• 異常欄位：${dataset.problemColumns.length} 種\n• 偵測月份：${monthsText}\n\n請點擊「▶ 執行趨勢與異常運算」。`);
            });
        });

        // 2️⃣ 監聽【上月】檔案上傳 (選填)
        document.getElementById('prevFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) {
                prevParsedDataset = null;
                document.getElementById('prevFileStatus').innerText = '若未上傳，將自動從檔案內上月資料或現有 sim_data.js 帶入';
                return;
            }

            loadReportFile(file, function(err, dataset) {
                if (err) {
                    alert('❌ 上月報表讀取失敗：' + err.message);
                    console.error(err);
                    return;
                }
                prevParsedDataset = dataset;
                const sysTag = dataset.isNewSystemFormat ? '新系統格式' : '舊系統格式';
                const monthsText = dataset.detectedMonths.map(m => m + '月').join(', ');
                const statusEl = document.getElementById('prevFileStatus');
                statusEl.innerHTML = `<span class="status-badge">✅ 上月報表 (${sysTag})｜包含月份：${monthsText}</span>`;
            });
        });

        function getTrend(current, prev, isPercent = false) {
            const diff = current - prev;
            if (diff === 0) return `<span class="trend-flat">-</span>`;
            const sign = diff > 0 ? "+" : "";
            const valStr = isPercent ? diff.toFixed(1) + "%" : diff;
            if (diff > 0) return `<span class="trend-up">${sign}${valStr}</span>`;
            return `<span class="trend-down">${valStr}</span>`;
        }

        function generateFinalTopProblems(cityCurrentData) {
            let top_problems = {};
            ['a', 'b', 'c'].forEach(grade => {
                let issues = cityCurrentData['prob' + grade.toUpperCase()]; 
                if (issues && Object.keys(issues).length > 0) {
                    let sorted = Object.entries(issues)
                        .sort((a, b) => b[1] - a[1]) 
                        .slice(0, 3); 
                    top_problems[grade] = sorted.map(p => `${p[0]}(${p[1]})`).join('、');
                } else {
                    top_problems[grade] = "目前無具體問題紀錄";
                }
            });
            // 🌟 胎壓未達標準明細（獨立供應給報告模式第 2 頁「前後胎壓未達標準」點擊檢視）
            let tireIssues = cityCurrentData.probTire;
            if (tireIssues && Object.keys(tireIssues).length > 0) {
                let sortedTire = Object.entries(tireIssues)
                    .sort((a, b) => b[1] - a[1]);
                top_problems.tire = sortedTire.map(p => `${p[0]}(${p[1]})`).join('、');
            } else {
                top_problems.tire = "目前無具體問題紀錄";
            }
            return top_problems;
        }

        // 🧮 針對單一資料集與指定月份，統計各區車數、A/B/C 異常車數與問題明細
        function accumulateDatasetForMonth(dataset, targetMonthStr, stats, isCurrentMonth) {
            if (!dataset || !dataset.rows) return 0;
            let matchedRowCount = 0;

            dataset.rows.forEach(row => {
                const region = row._region;
                const month = row._month;
                if (!region || month !== targetMonthStr) return;

                matchedRowCount++;

                if (!stats[region]) {
                    stats[region] = {
                        current: { total: 0, a: 0, b: 0, c: 0, probA: {}, probB: {}, probC: {}, probTire: {}, probUnknown: {} },
                        prev: { total: 0, a: 0, b: 0, c: 0 }
                    };
                }

                const targetBucket = isCurrentMonth ? stats[region].current : stats[region].prev;

                // 檢查是否有舊系統的 A級 / B級 / C級 彙總欄
                let isA = isCheckedValue(row['A級']);
                let isB = isCheckedValue(row['B級']);
                let isC = isCheckedValue(row['C級']);

                // 🌟 掃描胎壓相關欄位（歸類為基本資料，不列入 A/B/C 級計算，但記錄至 probTire 供報告模式第 2 頁顯示）
                if (isCurrentMonth && DATA_PARSER_CONFIG.tireProblemCols) {
                    DATA_PARSER_CONFIG.tireProblemCols.forEach(tCol => {
                        if (row[tCol] !== undefined && isCheckedValue(row[tCol])) {
                            problemDictionary.tire.add(tCol);
                            targetBucket.probTire[tCol] = (targetBucket.probTire[tCol] || 0) + 1;
                        }
                    });
                }

                // 掃描所有異常問題欄位：
                // 1) 在新系統中，車次是否屬於 A/B/C 級異常車，是由該車是否有勾選任一 A/B/C 級問題欄位決定（已排除胎壓欄位）
                // 2) 若為本月數據，同步累計各異常問題的發生次數與字典分類
                dataset.problemColumns.forEach(pCol => {
                    if (isCheckedValue(row[pCol])) {
                        let realGrade = autoGradeIssue(pCol, dataset.colGrades);
                        if (dataset.isNewSystemFormat) {
                            if (realGrade === 'a') isA = true;
                            else if (realGrade === 'b') isB = true;
                            else if (realGrade === 'c') isC = true;
                        }

                        if (isCurrentMonth) {
                            problemDictionary[realGrade].add(pCol);
                            let targetProbObj = realGrade === 'unknown' ? 'probUnknown' : 'prob' + realGrade.toUpperCase();
                            targetBucket[targetProbObj][pCol] = (targetBucket[targetProbObj][pCol] || 0) + 1;
                        }
                    }
                });

                targetBucket.total += 1;
                if (isA) targetBucket.a += 1;
                if (isB) targetBucket.b += 1;
                if (isC) targetBucket.c += 1;
            });

            return matchedRowCount;
        }

        function processData() {
            if (!currParsedDataset || currParsedDataset.rows.length === 0) {
                alert("請先在「1. 載入【本月】報表」選擇 Excel (.xlsx) 或 CSV 檔案！");
                return;
            }

            // 重置字典狀態
            problemDictionary = { a: new Set(), b: new Set(), c: new Set(), tire: new Set(), unknown: new Set() };

            const targetMonthNum = parseInt(document.getElementById('monthFilter').value, 10);
            const prevMonthNum = targetMonthNum === 1 ? 12 : targetMonthNum - 1;
            const targetMonthStr = targetMonthNum.toString();
            const prevMonthStr = prevMonthNum.toString();

            const stats = {};

            // 1. 計算【本月】數據
            const currCount = accumulateDatasetForMonth(currParsedDataset, targetMonthStr, stats, true);
            if (currCount === 0) {
                const avail = currParsedDataset.detectedMonths.map(m => m + '月').join('、');
                alert(`⚠️ 在本月報表中找不到「${targetMonthNum}月」的資料！\n檔案內偵測到的月份為：${avail || '無'}\n請調整「3. 目標月份」後再試一次。`);
                return;
            }

            // 2. 計算【上月】數據（三層智慧對齊機制）：
            //    優先序 A：若有單獨上傳「2. 上月報表」，優先從上月報表撈取 prevMonthStr（若上月報表只有單一月份則直接取該月份）
            //    優先序 B：若未上傳上月報表，嘗試從「1. 本月報表」內撈取 prevMonthStr（相容舊版全年度 CSV）
            //    優先序 C：若本月報表為新系統單月 Excel（無上月資料），自動從現有專案的 window.simJsonData 帶入上月數據！
            let prevSourceLabel = '';
            let prevCount = 0;

            if (prevParsedDataset && prevParsedDataset.rows.length > 0) {
                let usePrevMonthStr = prevMonthStr;
                if (!prevParsedDataset.detectedMonths.includes(prevMonthNum) && prevParsedDataset.detectedMonths.length === 1) {
                    usePrevMonthStr = prevParsedDataset.detectedMonths[0].toString();
                }
                prevCount = accumulateDatasetForMonth(prevParsedDataset, usePrevMonthStr, stats, false);
                prevSourceLabel = `來自上傳之上月報表 (${usePrevMonthStr}月)`;
            } else {
                prevCount = accumulateDatasetForMonth(currParsedDataset, prevMonthStr, stats, false);
                if (prevCount > 0) {
                    prevSourceLabel = `來自同份報表內之歷史月份 (${prevMonthStr}月)`;
                } else if (typeof simJsonData !== 'undefined' && Array.isArray(simJsonData)) {
                    simJsonData.forEach(item => {
                        const reg = normalizeRegion(item.region);
                        if (!stats[reg]) return;
                        // 若現有 sim_data.js 的 current_month 有值 (>0)，取 current_month 作為上月；若已被歸零則取 prev_month
                        const src = (item.current_month && item.current_month.total > 0) ? item.current_month : item.prev_month;
                        if (src) {
                            stats[reg].prev = {
                                total: src.total || 0,
                                a: src.a || 0,
                                b: src.b || 0,
                                c: src.c || 0
                            };
                        }
                    });
                    prevSourceLabel = `自動從現有 sim_data.js 帶入上月基準數據`;
                }
            }

            renderUI(stats, targetMonthNum, prevMonthNum, prevSourceLabel);
        }

        function renderUI(stats, mCurrent, mPrev, prevSourceLabel = '') {
            
            // --- 🌟 1. 渲染系統分級字典面板 ---
            let dictHtml = `
                <h3>📚 系統分級字典庫與未知問題捕捉 <span style="font-size:0.8em; font-weight:normal; color:var(--text-secondary);">(${prevSourceLabel ? '上月資料來源：' + prevSourceLabel : ''})</span></h3>
                <p>以下為本次資料中「有實際發生過」的異常，系統將它們歸類的結果：</p>
                <div class="dict-section">
                    <h4>🟢 A級判定成功 (${problemDictionary.a.size} 項)</h4>
                    <p>${Array.from(problemDictionary.a).join('、') || '無'}</p>
                </div>
                <div class="dict-section">
                    <h4>🟡 B級判定成功 (${problemDictionary.b.size} 項)</h4>
                    <p>${Array.from(problemDictionary.b).join('、') || '無'}</p>
                </div>
                <div class="dict-section">
                    <h4>🟠 C級判定成功 (${problemDictionary.c.size} 項)</h4>
                    <p>${Array.from(problemDictionary.c).join('、') || '無'}</p>
                </div>
                <div class="dict-section">
                    <h4 style="color: #38bdf8;">🛞 胎壓未達標項目 (${problemDictionary.tire.size} 項｜歸類為基本資料，不列入 A/B/C 級，移至報告第 2 頁顯示)</h4>
                    <p>${Array.from(problemDictionary.tire).join('、') || '無'}</p>
                </div>
                <div class="dict-section dict-unknown">
                    <h4>🚨 未能被判定的問題 (漏網之魚)</h4>
                    <p style="font-weight: bold; font-size: 1.1em;">
                        ${Array.from(problemDictionary.unknown).join('、') || '✨ 太棒了！所有發生的問題皆已成功配對分類 ✨'}
                    </p>
                    <p style="font-size: 0.85em; margin-top: 5px;">* 提示：新系統 Excel 會自動讀取第 1 列的 A/B/C 分級標記；若上傳無分級標記的 CSV 且出現紅字，請將關鍵字補入程式碼的 <code>GRADING_RULES</code>。</p>
                </div>
            `;
            document.getElementById('dictContainer').innerHTML = dictHtml;
            document.getElementById('dictContainer').style.display = 'block';

            // --- 2. 渲染對齊表 ---
            let tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2" style="background:#0f172a;">地區</th>
                            <th colspan="3" class="group-total">總檢修車數</th>
                            <th colspan="4" class="group-a">A級 狀態對比</th>
                            <th colspan="4" class="group-b">B級 狀態對比</th>
                            <th colspan="4" class="group-c">C級 狀態對比</th>
                        </tr>
                        <tr>
                            <th class="group-total">本月(${mCurrent}月)</th>
                            <th class="group-total">上月(${mPrev}月)</th>
                            <th class="group-total">增減</th>
                            
                            <th class="group-a">本月數量</th>
                            <th class="group-a">上月數量</th>
                            <th class="group-a">本月佔比</th>
                            <th class="group-a">佔比增減</th>

                            <th class="group-b">本月數量</th>
                            <th class="group-b">上月數量</th>
                            <th class="group-b">本月佔比</th>
                            <th class="group-b">佔比增減</th>

                            <th class="group-c">本月數量</th>
                            <th class="group-c">上月數量</th>
                            <th class="group-c">本月佔比</th>
                            <th class="group-c">佔比增減</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            const sortedRegions = Object.keys(stats).sort((a, b) => {
                let indexA = targetRegionOrder.findIndex(target => a.includes(target));
                let indexB = targetRegionOrder.findIndex(target => b.includes(target));
                if (indexA === -1) indexA = 999;
                if (indexB === -1) indexB = 999;
                return indexA - indexB;
            });

            let problemsHtml = ''; 
            const orderedStatsArray = []; 

            for (const reg of sortedRegions) {
                const cur = stats[reg].current;
                const prv = stats[reg].prev;

                const curRA = cur.total > 0 ? (cur.a / cur.total * 100) : 0;
                const prvRA = prv.total > 0 ? (prv.a / prv.total * 100) : 0;
                const curRB = cur.total > 0 ? (cur.b / cur.total * 100) : 0;
                const prvRB = prv.total > 0 ? (prv.b / prv.total * 100) : 0;
                const curRC = cur.total > 0 ? (cur.c / cur.total * 100) : 0;
                const prvRC = prv.total > 0 ? (prv.c / prv.total * 100) : 0;

                tableHtml += `
                    <tr>
                        <td style="font-weight:bold;">${reg}</td>
                        <td class="group-total">${cur.total.toLocaleString()}</td>
                        <td class="group-total data-prev">${prv.total.toLocaleString()}</td>
                        <td class="group-total">${getTrend(cur.total, prv.total, false)}</td>
                        
                        <td class="group-a">${cur.a}</td>
                        <td class="group-a data-prev">${prv.a}</td>
                        <td class="group-a">${curRA.toFixed(1)}%</td>
                        <td class="group-a">${getTrend(curRA, prvRA, true)}</td>

                        <td class="group-b">${cur.b}</td>
                        <td class="group-b data-prev">${prv.b}</td>
                        <td class="group-b">${curRB.toFixed(1)}%</td>
                        <td class="group-b">${getTrend(curRB, prvRB, true)}</td>

                        <td class="group-c" style="font-weight:bold;">${cur.c}</td>
                        <td class="group-c data-prev">${prv.c}</td>
                        <td class="group-c" style="font-weight:bold;">${curRC.toFixed(1)}%</td>
                        <td class="group-c">${getTrend(curRC, prvRC, true)}</td>
                    </tr>
                `;

                const topProbs = generateFinalTopProblems(cur);

                problemsHtml += `
                    <div class="problem-card">
                        <h4>📍 ${reg}</h4>
                        <div class="prob-row"><span class="prob-label label-a">A級常見:</span><span class="prob-text">${topProbs.a}</span></div>
                        <div class="prob-row"><span class="prob-label label-b">B級常見:</span><span class="prob-text">${topProbs.b}</span></div>
                        <div class="prob-row"><span class="prob-label label-c">C級常見:</span><span class="prob-text">${topProbs.c}</span></div>
                        <div class="prob-row" style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border-color);"><span class="prob-label" style="color:#38bdf8;">胎壓未達標:</span><span class="prob-text">${topProbs.tire}</span></div>
                    </div>
                `;

                orderedStatsArray.push({ 
                    region: reg, 
                    current_month: {
                        total: cur.total, a: cur.a, b: cur.b, c: cur.c,
                        top_problems: topProbs
                    }, 
                    prev_month: { total: prv.total, a: prv.a, b: prv.b, c: prv.c } 
                });
            }
            
            tableHtml += `</tbody></table>`;
            document.getElementById('tableContainer').innerHTML = tableHtml;

            document.getElementById('problemsContainer').style.display = 'block';
            document.getElementById('problemsGrid').innerHTML = problemsHtml;

            const finalOutput = `const simJsonData = ${JSON.stringify(orderedStatsArray, null, 4)};`;
            document.getElementById('jsonOutput').value = finalOutput;
        }

        function copyJson() {
            const jsonText = document.getElementById('jsonOutput').value;
            if (!jsonText) {
                alert("⚠️ 請先載入報表並點擊「執行趨勢與異常運算」！");
                return;
            }
            navigator.clipboard.writeText(jsonText).then(() => {
                alert("✅ JSON 數據已成功複製！請直接去貼上覆蓋 sim_data.js 內容。");
            }).catch(err => {
                console.error('複製失敗:', err);
                alert("❌ 複製失敗，請手動在框內全選並複製 (Ctrl+C)。");
            });
        }

        function downloadJson() {
            const jsonText = document.getElementById('jsonOutput').value;
            if (!jsonText) {
                alert("⚠️ 請先載入報表並點擊「執行趨勢與異常運算」！");
                return;
            }

            const fileName = `sim_data.js`;

            const blob = new Blob([jsonText], { type: "text/javascript;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
